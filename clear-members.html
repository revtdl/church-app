<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Members Data - Church Nexus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        button {
            background: #dc3545;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background: #c82333;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .status.loading {
            background: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #383d41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ Clear Member Data</h1>

        <div class="warning">
            <strong>⚠️ WARNING:</strong> This action will permanently delete ALL member records from Firebase. This cannot be undone!
        </div>

        <p>Click the button below to delete all members and start fresh:</p>

        <button id="deleteBtn" onclick="clearAllMembers()">🗑️ DELETE ALL MEMBERS</button>

        <div id="status" class="status"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config (inline to ensure it loads) -->
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDXN2CFtyuZQbGKJbciB8Nm9WYTGVxXQ6g",
            authDomain: "churchapp-74dec.firebaseapp.com",
            projectId: "churchapp-74dec",
            storageBucket: "churchapp-74dec.firebasestorage.app",
            messagingSenderId: "684996448330",
            appId: "1:684996448330:web:4531fce57b5af27c4c16b3"
        };

        // Initialize Firebase App
        firebase.initializeApp(firebaseConfig);
        console.log('✅ Firebase initialized');

        async function clearAllMembers() {
            const statusDiv = document.getElementById('status');
            const deleteBtn = document.getElementById('deleteBtn');

            try {
                deleteBtn.disabled = true;
                statusDiv.className = 'status loading';
                statusDiv.innerHTML = '<span class="spinner"></span>Connecting to Firebase...';

                // Get Firestore instance
                const db = firebase.firestore();
                console.log('✅ Firestore connected');

                // Fetch all members
                statusDiv.innerHTML = '<span class="spinner"></span>Fetching members...';
                const snapshot = await db.collection('members').get();
                const count = snapshot.size;

                console.log(`Found ${count} members to delete`);

                if (count === 0) {
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = '✅ <strong>No members found!</strong> The database is already empty.';
                    deleteBtn.disabled = false;
                    return;
                }

                statusDiv.innerHTML = `<span class="spinner"></span>Deleting ${count} member(s)...`;

                // Delete all members in batches
                const batch = db.batch();
                snapshot.forEach(doc => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
                console.log(`✅ Deleted ${count} members`);

                statusDiv.className = 'status success';
                statusDiv.innerHTML = `✅ <strong>Success!</strong> Deleted ${count} member(s). Database is now clear. Ready to add fresh members!`;

                deleteBtn.disabled = false;

            } catch (error) {
                console.error('❌ Error:', error);
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `❌ <strong>Error:</strong> ${error.message}`;
                deleteBtn.disabled = false;
            }
        }

        // Log when Firebase is ready
        window.addEventListener('load', function() {
            console.log('✅ Page loaded, Firebase ready');
        });
    </script>
</body>
</html>
